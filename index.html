
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>NEXO+ PET | Identificación de mascotas</title>
  <meta name="description" content="Identificación de mascotas NEXO+ PET. Si encontraste una mascota, contactá a su responsable.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --green: #16a34a;
      --dark: #111827;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f1f5f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
    }

    header {
      background: var(--dark);
      color: white;
      text-align: center;
      padding: 25px 16px;
    }

    .brand {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand span { color: #4ade80; }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    main {
      width: min(100% - 28px, 520px);
      margin: 28px auto;
    }

    .panel {
      background: white;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, .06);
    }

    h1 {
      font-size: 23px;
      margin: 0 0 10px;
      text-align: center;
    }

    .intro {
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      font-size: 15px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 22px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    button, .whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: white;
      font-weight: 700;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      margin-top: 16px;
      padding: 13px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .hidden { display: none !important; }

    .pet-photo {
      display: block;
      width: 100%;
      max-height: 340px;
      object-fit: cover;
      border-radius: 14px;
      margin: 18px 0;
      background: #e2e8f0;
    }

    .pet-info {
      margin-top: 22px;
      border-top: 1px solid var(--border);
    }

    .info-row {
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .info-label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 17px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .status {
      padding: 12px;
      background: #fef3c7;
      color: #92400e;
      border-radius: 10px;
      text-align: center;
      line-height: 1.5;
    }

    .secondary {
      background: #e2e8f0;
      color: var(--dark);
    }

    footer {
      padding: 10px 16px 28px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    footer strong { color: var(--dark); }

    .loading {
      text-align: center;
      padding: 28px 8px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">NEXO<span>+</span> PET</div>
    <p>Identificación y protección de mascotas</p>
  </header>

  <main>
    <section id="homePanel" class="panel">
      <h1>Identificá una mascota</h1>
      <p class="intro">
        Si encontraste una mascota con identificación NEXO+ PET,
        ingresá el código para comprobar si existe.
      </p>

      <form id="searchForm">
        <label for="codigo">Código de identificación</label>
        <input
          id="codigo"
          name="codigo"
          type="text"
          placeholder="Ejemplo: NX-001"
          autocomplete="off"
          maxlength="50"
          required
        >
        <button id="searchButton" type="submit">Buscar identificación</button>
      </form>

      <div id="searchMessage" class="message hidden" role="status"></div>
    </section>

    <section id="petPanel" class="panel hidden" aria-live="polite">
      <div id="petContent" class="loading">Consultando identificación...</div>
    </section>
  </main>

  <footer>
    <strong>NEXO+ PET</strong><br>
    Soluciones que conectan
  </footer>

  <script>
    // Configuración de Supabase
    const SUPABASE_URL = 'https://phjjzrhnygowxhnpcacp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_UG_UlMdRuaN2mW7vChYWyw_eKuQEgIv';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const homePanel = document.getElementById('homePanel');
    const petPanel = document.getElementById('petPanel');
    const petContent = document.getElementById('petContent');
    const searchForm = document.getElementById('searchForm');
    const searchButton = document.getElementById('searchButton');
    const searchMessage = document.getElementById('searchMessage');

    function showMessage(element, message, type = 'info') {
      element.textContent = message;
      element.classList.remove('hidden');
      element.style.background =
        type === 'error' ? '#fee2e2' :
        type === 'success' ? '#dcfce7' : '#e0f2fe';
      element.style.color =
        type === 'error' ? '#991b1b' :
        type === 'success' ? '#166534' : '#075985';
    }

    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function validPhotoURL(value) {
      if (!value) return '';
      try {
        const url = new URL(value);
        return url.protocol === 'https:' ? url.href : '';
      } catch {
        return '';
      }
    }

    function validWhatsAppURL(value) {
      if (!value) return '';
      try {
        const url = new URL(value);
        if (
          url.protocol === 'https:' &&
          url.hostname === 'wa.me' &&
          /^\/[0-9]+$/.test(url.pathname)
        ) {
          return url.href;
        }
      } catch {}
      return '';
    }

    async function loadPet(token) {
      homePanel.classList.add('hidden');
      petPanel.classList.remove('hidden');
      petContent.className = 'loading';
      petContent.textContent = 'Buscando la información de la mascota...';

      if (
        typeof token !== 'string' ||
        !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token)
      ) {
        petContent.className = 'status';
        petContent.textContent = 'El enlace de identificación no es válido. Revisá el QR.';
        return;
      }

      try {
        const { data, error } = await supabaseClient.rpc(
          'consultar_mascota_por_token',
          { token_ingresado: token }
        );

        if (error) throw error;

        if (!data || !data.nombre) {
          petContent.className = '';
          petContent.innerHTML = `
            <h1>Identificación NEXO+ PET</h1>
            <p class="status">
              Esta identificación todavía no tiene una mascota registrada
              o no se encuentra disponible.
            </p>
            <p class="intro">Si necesitás ayuda, contactá a NEXO+ PET.</p>
          `;
          return;
        }

        const photo = validPhotoURL(data.foto_url);
        const whatsapp = validWhatsAppURL(data.whatsapp_url);

        petContent.className = '';
        petContent.innerHTML = `
          <h1>¡Ayudanos a volver a casa!</h1>
          <p class="intro">Encontraste una mascota identificada con NEXO+ PET.</p>

          ${photo
            ? `<img class="pet-photo" src="${escapeHTML(photo)}" alt="Foto de ${escapeHTML(data.nombre)}">`
            : ''
          }

          <div class="pet-info">
            <div class="info-row">
              <span class="info-label">Nombre de la mascota</span>
              <div class="info-value">${escapeHTML(data.nombre)}</div>
            </div>

            ${data.raza ? `
              <div class="info-row">
                <span class="info-label">Raza</span>
                <div class="info-value">${escapeHTML(data.raza)}</div>
              </div>
            ` : ''}

            ${data.responsable ? `
              <div class="info-row">
                <span class="info-label">Responsable</span>
                <div class="info-value">${escapeHTML(data.responsable)}</div>
              </div>
            ` : ''}
          </div>

          ${whatsapp
            ? `<a class="whatsapp" href="${escapeHTML(whatsapp)}" target="_blank" rel="noopener noreferrer">💬 CONTACTAR POR WHATSAPP</a>`
            : `<p class="status">Por el momento no hay un WhatsApp de contacto disponible.</p>`
          }

          <p class="intro">Gracias por ayudar a que esta mascota vuelva a su hogar.</p>
        `;
      } catch (error) {
        console.error('Error consultando mascota:', error);
        petContent.className = 'status';
        petContent.textContent =
          'No pudimos consultar la identificación en este momento. Intentá nuevamente más tarde.';
      }
    }

    searchForm.addEventListener('submit', async event => {
      event.preventDefault();

      const codigo = document.getElementById('codigo').value.trim();

      if (!codigo) return;

      searchButton.disabled = true;
      searchButton.textContent = 'Consultando...';
      searchMessage.classList.add('hidden');

      try {
        const { data, error } = await supabaseClient.rpc(
          'buscar_identificador',
          { codigo_ingresado: codigo }
        );

        if (error) throw error;

        if (data === true) {
          showMessage(
            searchMessage,
            'Identificación encontrada. La información de contacto se habilitará cuando completemos el registro.',
            'success'
          );
        } else {
          showMessage(
            searchMessage,
            'No encontramos ese código. Revisá que esté escrito correctamente.',
            'error'
          );
        }
      } catch (error) {
        console.error('Error buscando código:', error);
        showMessage(
          searchMessage,
          'No pudimos realizar la búsqueda. Intentá nuevamente más tarde.',
          'error'
        );
      } finally {
        searchButton.disabled = false;
        searchButton.textContent = 'Buscar identificación';
      }
    });

    // Si la página se abre desde un QR, consultar directamente el token.
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (token) {
      loadPet(token);
    }
  </script>
</body>
</html>
